name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: Store-Version an dieses bestehende Release hängen (z. B. v0.10.0)'
        required: false
        default: ''
  # Store-Version: auf GitHub ein Release veröffentlichen (Tag z. B. v0.9) → signiertes .aab/.apk hängt danach am Release
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Android-Workload installieren
        run: dotnet workload install android

      - name: Unit-Tests (Logik ohne Android)
        run: dotnet test tests/ZBoard.Core.Tests --logger "console;verbosity=normal"

      # Debug-Builds legen die .NET-Assemblies sonst nicht in die APK (nur für Deploy aus der IDE gedacht);
      # mit EmbedAssembliesIntoApk lässt sich die APK direkt installieren.
      - name: App bauen (Debug-APK)
        run: dotnet build ZBoard.csproj -c Debug -f net10.0-android -p:EmbedAssembliesIntoApk=true

      # Nur APKs mit dem festen Testschlüssel lassen sich als Update über ältere Testversionen installieren.
      - name: Signatur prüfen
        run: |
          APK=$(ls bin/Debug/net10.0-android/*-Signed.apk | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          grep -qi "7f94a11a131b687073d97d011fff3ab194834eb125007ba3a0feaf46eaaa3e8c" signer.txt

      - name: APK bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: zboard-debug-apk
          path: bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error

      # Plugin-App "zBoard DeepL" (eigene App mit Internet, siehe docs/PLUGINS.md), wie zBoard mit dem
      # Testschlüssel signiert, damit zBoard sie als "vom selben Entwickler" anzeigt.
      - name: Plugin zBoard DeepL bauen (Debug-APK)
        run: dotnet build plugin-apps/DeepL/ZBoard.DeepL.csproj -c Debug -f net10.0-android -p:EmbedAssembliesIntoApk=true

      - name: Plugin-APK bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: zboard-deepl-debug-apk
          path: plugin-apps/DeepL/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error

      # Plugin-App "zBoard Sync" (Google Drive, OneDrive, Dropbox, WebDAV), ebenfalls mit dem Testschlüssel
      - name: Plugin zBoard Sync bauen (Debug-APK)
        run: dotnet build plugin-apps/Sync/ZBoard.Sync.csproj -c Debug -f net10.0-android -p:EmbedAssembliesIntoApk=true

      - name: Sync-Plugin-APK bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: zboard-sync-debug-apk
          path: plugin-apps/Sync/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error

  # Release-Build (AOT, getrimmt) mit Testhaken und Testschlüssel: so nah an der Store-Version wie möglich,
  # aber im Emulator prüfbar und über ältere Testversionen installierbar.
  release-test-build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Android-Workload installieren
        run: dotnet workload install android

      - name: App bauen (Release mit AOT, Testhaken)
        run: dotnet build ZBoard.csproj -c Release -f net10.0-android -p:ZBoardTestHooks=true -p:AndroidPackageFormats=apk

      - name: Signatur prüfen
        run: |
          APK=$(ls bin/Release/net10.0-android/*-Signed.apk | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          grep -qi "7f94a11a131b687073d97d011fff3ab194834eb125007ba3a0feaf46eaaa3e8c" signer.txt

      - name: APK bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: zboard-release-apk
          path: bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error

  emulator-test:
    if: github.event_name != 'release'
    needs: [build, release-test-build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: zboard-${{ matrix.variant }}-apk
          path: apk

      - name: KVM für den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tastatur im Emulator testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35  # Android 15: Tastaturfenster reicht bis unter die Navigationsleiste
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ZBOARD_LOG_SCREENSHOTS=1 python3 tools/emulator_test.py "$(ls apk/*.apk | head -n 1)" emulator-test

      - name: Screenshots und Log bereitstellen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-test-${{ matrix.variant }}
          path: emulator-test/
          if-no-files-found: warn

  # Neueste getestete Version unter einer festen Adresse:
  # https://github.com/World-of-Bytes/zBoard/releases/download/testversion/zboard-test.apk
  testversion:
    needs: [release-test-build, emulator-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: zboard-release-apk
          path: apk

      - name: Testversion veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp "$(ls apk/*.apk | head -n 1)" zboard-test.apk
          gh release delete testversion --repo "$REPO" --yes --cleanup-tag || true
          gh release create testversion zboard-test.apk --repo "$REPO" --prerelease \
            --target "${{ github.sha }}" \
            --title "Testversion (neuester Stand)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}, Emulator-Test bestanden. Release-Build (AOT) mit dem öffentlichen Testschlüssel – zum Ausprobieren, nicht die Play-Store-Version."

  # Store-Version: läuft, wenn auf GitHub ein Release veröffentlicht wird (oder von Hand).
  # Braucht die Repository-Secrets ZBOARD_UPLOAD_KEYSTORE (Keystore als Base64), ZBOARD_UPLOAD_STORE_PASSWORD,
  # ZBOARD_UPLOAD_KEY_ALIAS und ZBOARD_UPLOAD_KEY_PASSWORD.
  store-release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Upload-Schlüssel vorhanden?
        env:
          KEYSTORE: ${{ secrets.ZBOARD_UPLOAD_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Secret ZBOARD_UPLOAD_KEYSTORE fehlt – Anleitung in signing/README.md"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Android-Workload installieren
        run: dotnet workload install android

      - name: Store-Version bauen (.aab und .apk)
        env:
          STORE_PASS: ${{ secrets.ZBOARD_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZBOARD_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ZBOARD_UPLOAD_KEY_PASSWORD }}
        run: >
          dotnet publish ZBoard.csproj -c Release -f net10.0-android -o store
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore"
          -p:AndroidSigningStorePass="$STORE_PASS"
          -p:AndroidSigningKeyAlias="$KEY_ALIAS"
          -p:AndroidSigningKeyPass="$KEY_PASS"

      # Plugin-App "zBoard DeepL" mit demselben Upload-Schlüssel, damit zBoard sie als "vom selben Entwickler" anzeigt
      - name: Plugin zBoard DeepL bauen (.aab und .apk)
        env:
          STORE_PASS: ${{ secrets.ZBOARD_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZBOARD_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ZBOARD_UPLOAD_KEY_PASSWORD }}
        run: >
          dotnet publish plugin-apps/DeepL/ZBoard.DeepL.csproj -c Release -f net10.0-android -o store-deepl
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore"
          -p:AndroidSigningStorePass="$STORE_PASS"
          -p:AndroidSigningKeyAlias="$KEY_ALIAS"
          -p:AndroidSigningKeyPass="$KEY_PASS"

      - name: Plugin zBoard Sync bauen (.aab und .apk)
        env:
          STORE_PASS: ${{ secrets.ZBOARD_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZBOARD_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ZBOARD_UPLOAD_KEY_PASSWORD }}
        run: >
          dotnet publish plugin-apps/Sync/ZBoard.Sync.csproj -c Release -f net10.0-android -o store-sync
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore"
          -p:AndroidSigningStorePass="$STORE_PASS"
          -p:AndroidSigningKeyAlias="$KEY_ALIAS"
          -p:AndroidSigningKeyPass="$KEY_PASS"

      - name: Dateien benennen
        run: |
          VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' ZBoard.csproj)
          DEEPL_VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' plugin-apps/DeepL/ZBoard.DeepL.csproj)
          mkdir out
          cp store/*-Signed.aab "out/zboard-$VERSION.aab"
          cp store/*-Signed.apk "out/zboard-$VERSION.apk"
          cp store-deepl/*-Signed.aab "out/zboard-deepl-$DEEPL_VERSION.aab"
          cp store-deepl/*-Signed.apk "out/zboard-deepl-$DEEPL_VERSION.apk"
          SYNC_VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' plugin-apps/Sync/ZBoard.Sync.csproj)
          cp store-sync/*-Signed.aab "out/zboard-sync-$SYNC_VERSION.aab"
          cp store-sync/*-Signed.apk "out/zboard-sync-$SYNC_VERSION.apk"
          ls -l out

      - name: Bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: zboard-store
          path: out/

      - name: An das GitHub-Release hängen
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" out/* --repo "${{ github.repository }}" --clobber
