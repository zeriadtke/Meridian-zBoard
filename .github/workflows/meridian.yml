name: Meridian Tastatur

# zHealth Meridian: eigener Workflow der Meridian-Tastatur (zBoard-Fork). Läuft auf dem selbst gehosteten
# Windows-Runner und nur bei Pushes/Merges nach main. Der Workflow build.yml von zBoard (ubuntu-Runner,
# Emulator-Test, "testversion"-Release) ist für zBoard gedacht und wird in diesem Fork nicht gebraucht – in den
# Actions-Einstellungen deaktivieren.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: meridian-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Gemeinsamer Signaturschlüssel mit der Meridian-App (siehe Directory.Build.targets). Pfad/Alias optional als
  # Repository-Variablen, Passwort als Secret. Ohne Secret wird mit dem zBoard-Testschlüssel signiert.
  MERIDIAN_KEYSTORE: ${{ vars.MERIDIAN_KEYSTORE || 'C:\keys\zhealth-meridian.jks' }}
  MERIDIAN_KEY_ALIAS: ${{ vars.MERIDIAN_KEY_ALIAS || 'zhealth' }}
  MERIDIAN_KEYSTORE_PASSWORD: ${{ secrets.MERIDIAN_KEYSTORE_PASSWORD }}
  MERIDIAN_KEY_PASSWORD: ${{ secrets.MERIDIAN_KEY_PASSWORD || secrets.MERIDIAN_KEYSTORE_PASSWORD }}

jobs:
  build:
    name: Tests und APK (Windows-Runner)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Umgebung
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          dotnet --info *>&1 | Select-Object -First 30 | Tee-Object ci-logs/env.log
          dotnet workload list *>&1 | Tee-Object -Append ci-logs/env.log

      - name: Unit-Tests Meridian (Tipp-Dynamik)
        id: tests
        continue-on-error: true
        run: |
          dotnet test tests/Meridian.Keyboard.Tests --logger "console;verbosity=normal" *>&1 | Tee-Object ci-logs/tests.log
          exit $LASTEXITCODE

      - name: Unit-Tests zBoard
        id: zboardtests
        continue-on-error: true
        run: |
          dotnet test tests/ZBoard.Core.Tests *>&1 | Tee-Object ci-logs/zboard-tests.log
          exit $LASTEXITCODE

      - name: APK bauen (Release, AOT)
        id: apk
        continue-on-error: true
        run: |
          dotnet build ZBoard.csproj -c Release -f net10.0-android -p:AndroidPackageFormats=apk -v:n *>&1 | Tee-Object ci-logs/apk.log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $apk = Get-ChildItem bin/Release/net10.0-android -Filter *-Signed.apk | Select-Object -First 1
            if (-not $apk) { Write-Error "Keine signierte APK gefunden"; exit 1 }
            if ($env:MERIDIAN_KEYSTORE_PASSWORD) {
              $dest = Join-Path $env:USERPROFILE "zhealth-apks"
              New-Item -ItemType Directory -Force $dest | Out-Null
              Copy-Item $apk.FullName (Join-Path $dest "zhealth-meridian-keyboard.apk") -Force
              Write-Host "APK: $dest\zhealth-meridian-keyboard.apk"
            } else {
              Write-Warning "Ohne MERIDIAN_KEYSTORE_PASSWORD mit dem zBoard-Testschlüssel signiert – Meridian nimmt davon keine Daten an."
            }
          }
          exit $code

      # Plugin-App "zBoard DeepL" (eigene App mit Internet, siehe docs/PLUGINS.md). Gleicher Schlüssel wie die
      # Tastatur, damit zBoard sie als "vom selben Entwickler" anzeigt.
      - name: Plugin zBoard DeepL bauen
        id: deepl
        continue-on-error: true
        run: |
          $sign = @("-p:AndroidKeyStore=true")
          if ($env:MERIDIAN_KEYSTORE_PASSWORD -and (Test-Path $env:MERIDIAN_KEYSTORE)) {
            $keyPass = if ($env:MERIDIAN_KEY_PASSWORD) { "env:MERIDIAN_KEY_PASSWORD" } else { "env:MERIDIAN_KEYSTORE_PASSWORD" }
            $sign += "-p:AndroidSigningKeyStore=$($env:MERIDIAN_KEYSTORE)", "-p:AndroidSigningStorePass=env:MERIDIAN_KEYSTORE_PASSWORD",
                     "-p:AndroidSigningKeyAlias=$($env:MERIDIAN_KEY_ALIAS)", "-p:AndroidSigningKeyPass=$keyPass"
          } else {
            $ks = Join-Path $PWD "signing/zboard-test.keystore"
            $sign += "-p:AndroidSigningKeyStore=$ks", "-p:AndroidSigningStorePass=zboard-test",
                     "-p:AndroidSigningKeyAlias=zboard-test", "-p:AndroidSigningKeyPass=zboard-test"
          }
          dotnet build plugin-apps/DeepL/ZBoard.DeepL.csproj -c Release -f net10.0-android -p:AndroidPackageFormats=apk @sign -v:n *>&1 | Tee-Object ci-logs/deepl.log
          exit $LASTEXITCODE

      - name: APK für den Download sammeln
        id: collect
        if: steps.apk.outcome == 'success'
        continue-on-error: true
        run: |
          $out = "out/apk-upload"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $out | Out-Null
          $apk = Get-ChildItem bin/Release/net10.0-android -Filter *-Signed.apk | Select-Object -First 1
          Copy-Item $apk.FullName (Join-Path $out "de.World_of_Bytes.zHealth.Meridian.Keyboard.apk")
          $plugin = Get-ChildItem plugin-apps/DeepL/bin/Release/net10.0-android -Filter *-Signed.apk -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($plugin) { Copy-Item $plugin.FullName (Join-Path $out "de.World_of_Bytes.zBoard.DeepL.apk") }

      - name: APK hochladen
        if: steps.collect.outcome == 'success'
        continue-on-error: true   # Speicherlimit für Artefakte darf die CI nicht blockieren
        uses: actions/upload-artifact@v5
        with:
          name: Meridian-Keyboard-apk
          path: out/apk-upload/
          if-no-files-found: error
          retention-days: 3

      # Feste Download-Links fürs Handy (ohne GitHub-Login, Artefakte brauchen einen):
      # https://github.com/<repo>/raw/apk/<datei>.apk – der Branch enthält immer nur den letzten Build.
      - name: APKs in Branch apk veröffentlichen
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "kb-apk"
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item out/apk-upload/* $dir
          Set-Content (Join-Path $dir "README.md") @("Letzter Build von main (Lauf ${{ github.run_id }}, Commit ${{ github.sha }}).", "",
            "- [Tastatur](https://github.com/${{ github.repository }}/raw/apk/de.World_of_Bytes.zHealth.Meridian.Keyboard.apk)",
            "- [zBoard DeepL](https://github.com/${{ github.repository }}/raw/apk/de.World_of_Bytes.zBoard.DeepL.apk)")
          Push-Location $dir
          git init -q -b apk
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "APKs ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
          Pop-Location

      - name: Logs in Branch ci-logs veröffentlichen
        if: always()
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "kb-cilogs"
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dir | Out-Null
          if (Test-Path ci-logs) { Copy-Item ci-logs/* $dir }
          foreach ($f in Get-ChildItem $dir -Filter *.log) {
            Select-String -Path $f.FullName -Pattern 'error |error:|Failed |FAILED|Exception|warning XA|warning MERIDIAN|zHealth Meridian:' |
              Select-Object -First 200 | ForEach-Object { $_.Line } | Set-Content ($f.FullName -replace '\.log$', '.errors.txt')
          }
          Set-Content (Join-Path $dir "RESULT.txt") @("run=${{ github.run_id }}", "sha=${{ github.sha }}",
            "tests=${{ steps.tests.outcome }}", "zboardtests=${{ steps.zboardtests.outcome }}", "apk=${{ steps.apk.outcome }}", "deepl=${{ steps.deepl.outcome }}")
          Push-Location $dir
          git init -q -b ci-logs
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "CI-Logs ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
          Pop-Location

      - name: Ergebnis
        if: always()
        run: |
          if ('${{ steps.tests.outcome }}' -eq 'failure' -or '${{ steps.zboardtests.outcome }}' -eq 'failure' -or '${{ steps.apk.outcome }}' -eq 'failure' -or '${{ steps.deepl.outcome }}' -eq 'failure') { exit 1 }
